name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install lint dependencies
        run: uv sync --no-default-groups --group lint --python 3.13
      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install test dependencies
        run: >-
          uv sync --no-default-groups --group test
          --python ${{ matrix.python-version }}
      - name: Run tests
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          coverage run -m pytest
      - name: Report coverage
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }}
          coverage report

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install docs dependencies
        run: uv sync --no-default-groups --group docs --python 3.13
      - name: Build documentation
        run: uv run --no-sync sphinx-build -b html -W docs/source docs/build/html

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install build dependencies
        run: uv sync --no-default-groups --group build --python 3.13
      - name: Build
        run: uv build
      - name: Check wheel contents
        run: uv run --no-sync check-wheel-contents dist
      - name: Check metadata
        run: uv run --no-sync twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: distributions
          path: dist/
