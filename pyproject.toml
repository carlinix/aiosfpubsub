[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "aiosfpubsub"
version = "0.2.0"
description = "Salesforce Pub/Sub API client for asyncio, replacing aiosfstream"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "aiohttp",
    "asyncio",
    "avro",
    "grpc",
    "pubsub",
    "salesforce",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.8.0",
    "fastavro>=1.7.0",
    "grpcio>=1.83.1",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
jwt = [
    "pyjwt[crypto]>=2.8,<3",
]

[[project.authors]]
name = "Ricardo Carlini Sperandio"
email = "rcarlini@gmail.com"

[project.urls]
Repository = "https://github.com/carlinix/aiosfpubsub"
Issues = "https://github.com/carlinix/aiosfpubsub/issues"

[dependency-groups]
build = [
    "check-wheel-contents>=0.6,<1",
    "twine>=6,<7",
]
docs = [
    "sphinx>=8.2,<10",
]
lint = [
    "ruff>=0.12,<1",
]
proto = [
    "grpcio-tools>=1.83.1",
]
test = [
    "coverage[toml]>=7.10,<8",
    "pyjwt[crypto]>=2.8,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "docs/build",
]
source-include = [
    ".readthedocs.yaml",
    "DESCRIPTION.rst",
    "docs/**",
    "tests/**",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiosfpubsub"]
omit = ["aiosfpubsub/pubsub_api_pb2*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["aiosfpubsub", "tests"]
target-version = "py311"
extend-exclude = [
    "aiosfpubsub/pubsub_api_pb2.py",
    "aiosfpubsub/pubsub_api_pb2_grpc.py",
]

[tool.ruff.lint]
ignore = ["ANN401"]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["aiosfpubsub"]
