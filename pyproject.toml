[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-salesforce-pubsub"
version = "0.1.0"
description = "Salesforce Pub/Sub API client using gRPC and asyncio, replacing aiosfstream"
authors = [
    { name="Ricardo Sperandio" }
]
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.83.1",
    "aiohttp>=3.8.0",
    "protobuf>=7.35.1",
    "fastavro>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10",
    "grpcio-tools>=1.83.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12"
]

[tool.setuptools.package-data]
simple_salesforce_pubsub = ["py.typed"]

[tool.setuptools]
packages = ["simple_salesforce_pubsub"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["simple_salesforce_pubsub"]
omit = ["simple_salesforce_pubsub/pubsub_api_pb2*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["simple_salesforce_pubsub", "tests"]
target-version = "py311"
extend-exclude = ["simple_salesforce_pubsub/pubsub_api_pb2.py",
                  "simple_salesforce_pubsub/pubsub_api_pb2_grpc.py"]

[tool.ruff.lint]
ignore = ["ANN401"]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["simple_salesforce_pubsub"]
