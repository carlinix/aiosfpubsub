name: Release

# Publish the exact distributions built from a release tag to GCP Artifact
# Registry and attach them to a GitHub Release. Tags are unprefixed SemVer,
# such as `0.3.0`, and must match `project.version`.
#
# There is no PyPI job: the `aiosfpubsub` name on PyPI belongs to another
# project (see CLAUDE.md, "Remaining gaps").
#
# One-time prerequisites (done on 2026-11-18):
#   1. Secrets GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT, the
#      latter a service account with write access to `avid-python-packages`.
#      Its Workload Identity binding only accepts runs triggered from a tag.
#   2. Repository variable ENABLE_GCP_PUBLISH set to `true`. Without it a tag
#      still produces a GitHub Release.
#
# A manual run must be started from the tag (Run workflow > "Use workflow
# from" > Tags), not from a branch; the guard rejects anything else, and the
# publishing identity would refuse it anyway.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  guard:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and package version
        id: check
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Run this workflow from a tag, not from a branch."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not an unprefixed SemVer version."
            exit 1
          fi
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install build dependencies
        run: uv sync --no-default-groups --group build --group docs --python 3.13
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate metadata
        run: uv run --no-sync twine check --strict dist/*
      - name: Validate wheel contents
        run: uv run --no-sync check-wheel-contents dist/*.whl
      - name: Build documentation from source distribution
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p extracted-sdist
          tar -xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz -C extracted-sdist
          uv run --project "$GITHUB_WORKSPACE" --no-sync sphinx-build -E -W --keep-going -b html extracted-sdist/*/docs/source sdist-docs
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-gcp:
    name: Publish to GCP Artifact Registry
    needs: [guard, build]
    if: ${{ vars.ENABLE_GCP_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install publishing dependencies
        run: uv sync --no-default-groups --group build --python 3.13
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Publish to Artifact Registry
        env:
          TWINE_REPOSITORY_URL: "https://us-central1-python.pkg.dev/fabled-lyceum-369319/avid-python-packages/"
          TWINE_USERNAME: oauth2accesstoken
          TWINE_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: >-
          uv run --no-sync twine upload
          --repository-url "$TWINE_REPOSITORY_URL"
          --non-interactive
          dist/* --verbose

  github-release:
    name: Create GitHub Release
    needs: [guard, build, publish-gcp]
    if: >-
      ${{ always()
      && needs.guard.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish-gcp.result == 'success'
          || needs.publish-gcp.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: >-
          gh release create "$VERSION" dist/*
          --title "$VERSION"
          --generate-notes
          --verify-tag
